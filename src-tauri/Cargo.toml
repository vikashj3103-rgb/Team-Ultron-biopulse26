[package]
name = "careconnect"
version = "1.0.0"
description = "CareConnect Clinical Platform Desktop Application"
authors = ["CareConnect Healthcare Solutions"]
edition = "2021"

[lib]
name = "careconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
